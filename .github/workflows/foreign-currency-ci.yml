name: Foreign currency regression checks
on:
  pull_request:
    paths:
      - 'src/**'
      - 'test/**'
      - 'package*.json'
      - '.github/workflows/foreign-currency-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-currency-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      # Existing project lockfile is incomplete for some optional native packages.
      - run: npm install --no-save --package-lock=false
      - run: npm test
      - run: npm run build
